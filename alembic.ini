# Alembic configuration (PRD §7: "All schema changes are migrations").
#
# The database URL is NOT stored here — it is injected at runtime from
# ``app.config.DATABASE_URL`` by ``backend/alembic/env.py`` so the same
# migration runs against local SQLite and Render PostgreSQL.
#
# Run from the repository root:
#     alembic upgrade head
#     alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
